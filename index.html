<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrandFlow V7 — AI Website & Funnel Studio</title>
<style>
:root{--brand:#29655f;--brand2:#dde8e3;--bg:#f7f5f0;--ink:#263331;--muted:#71807b;--line:#e3e8e5;--panel:#fff;--gold:#c8a96b}
*{box-sizing:border-box}body{margin:0;background:#eef1ef;color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:60px 1fr;overflow:hidden}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}.brand{font-weight:900;font-size:17px}.brand i{font-style:normal;color:var(--brand)}.crumb{color:var(--muted);font-size:12px;margin-left:10px}.topActions{display:flex;gap:7px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 11px}.btn:hover{border-color:#b9c9c4}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.icon{width:34px;padding:8px}.workspace{display:grid;grid-template-columns:250px minmax(400px,1fr) 330px;min-height:0}
.left,.right{background:#fff;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.leftPad,.rightPad{padding:15px}.navTitle,.panelTitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#87928e;font-weight:800;margin:10px 0}
.project{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:14px;background:#fafcfb}.project strong{display:block}.project small{color:var(--muted)}
.tree button,.pageBtn{width:100%;text-align:left;background:transparent;border:0;padding:8px 9px;border-radius:7px;color:var(--ink)}.tree button:hover,.pageBtn:hover,.tree .active,.pageBtn.active{background:var(--brand2);color:var(--brand)}
.sectionRow{display:flex;gap:5px}.sectionRow button:first-child{flex:1}.tiny{border:0;background:#f4f6f5;border-radius:6px;padding:5px 7px}
.main{min-width:0;display:flex;flex-direction:column;background:#e9edeb}.toolbar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px}.device.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.canvasWrap{flex:1;overflow:auto;padding:25px}.canvas{width:min(100%,980px);margin:0 auto;background:#fff;box-shadow:0 18px 55px #19382d16;min-height:1000px}.canvas.mobile{width:390px}.canvas.tablet{width:700px}
.section{position:relative;border:2px solid transparent}.section:hover,.section.selected{border-color:var(--brand)}.sectionTools{position:absolute;right:9px;top:9px;display:none;z-index:5;gap:4px}.section:hover .sectionTools,.section.selected .sectionTools{display:flex}.toolBtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 7px;box-shadow:0 2px 8px #0001}
.hero{padding:72px 54px;background:var(--bg);display:grid;grid-template-columns:1.08fr .92fr;gap:35px;align-items:center}.eyebrow{color:var(--brand);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hero h1,.section h2{font-family:Georgia,serif}.hero h1{font-size:52px;line-height:1.02;margin:10px 0 15px}.hero p,.body{color:var(--muted);line-height:1.7}.cta{display:inline-block;margin-top:15px;background:var(--brand);color:#fff;text-decoration:none;border-radius:8px;padding:12px 18px;font-weight:800}.visual{background:var(--brand2);border-radius:18px;overflow:hidden;min-height:300px}.visual svg{display:block;width:100%;height:100%;min-height:300px}
.block{padding:55px 45px}.block h2{font-size:34px;margin:0 0 12px}.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:25px}.card{border:1px solid var(--line);border-radius:13px;padding:19px;background:#fff}.card b{display:block;margin-bottom:7px}.offer{background:var(--brand);color:#fff;padding:55px 45px}.offer .body{color:#eaf2f0}.offer .cta{background:#fff;color:var(--brand)}.quote{font:22px/1.5 Georgia,serif}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.gallery .visual{min-height:170px}.faq{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.right .tabbar{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}.tabbar button{flex:1;border:0;background:#fff;padding:12px 4px;color:var(--muted);font-size:12px}.tabbar button.active{color:var(--brand);box-shadow:inset 0 -2px var(--brand)}
.chat{display:flex;flex-direction:column;gap:10px}.msg{padding:10px 11px;border-radius:11px;line-height:1.5;max-width:95%}.ai{background:#f2f5f3}.user{background:var(--brand);color:#fff;align-self:flex-end}.chatInput{display:flex;gap:6px;margin-top:8px}.chatInput input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px}.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.quick button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 9px;font-size:11px}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.field textarea{min-height:90px;resize:vertical}.swatches{display:flex;gap:7px}.swatch{height:31px;flex:1;border-radius:7px;border:1px solid #fff;box-shadow:0 0 0 1px var(--line)}
.score{background:var(--brand2);padding:12px;border-radius:10px;margin-bottom:12px}.score strong{font-size:23px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182b28;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:50}
@media(max-width:1050px){.workspace{grid-template-columns:220px 1fr}.right{display:none}}@media(max-width:720px){.workspace{grid-template-columns:1fr}.left{display:none}.hero{grid-template-columns:1fr;padding:48px 25px}.hero h1{font-size:40px}.grid,.gallery,.faq{grid-template-columns:1fr}.canvasWrap{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div><span class="brand">Brand<i>Flow</i></span><span class="crumb">AI Website & Funnel Studio · V7</span></div>
<div class="topActions"><button class="btn" onclick="saveProject()">Save</button><button class="btn" onclick="loadProject()">Load</button><button class="btn" onclick="undo()">Undo</button><button class="btn primary" onclick="exportProject()">Export HTML</button></div>
</header>
<div class="workspace">
<aside class="left"><div class="leftPad">
<div class="project"><strong id="projectName">Lumière Med Spa</strong><small id="projectMeta">Med Spa · Funnel</small></div>
<div class="navTitle">Pages</div><div id="pages"></div>
<div class="navTitle">Sections</div><div id="sectionTree" class="tree"></div>
<div class="navTitle">Brand</div><div class="tree">
<button onclick="openBrand()">🎨 Colors & Typography</button>
<button onclick="openImages()">🖼️ Image Studio</button>
<button onclick="openSEO()">🔍 SEO & Conversion</button>
</div>
<div class="navTitle">Project</div><div class="tree">
<button onclick="addPage()">＋ New Page</button>
<button onclick="duplicatePage()">⧉ Duplicate Page</button>
</div>
</div></aside>

<main class="main">
<div class="toolbar"><button class="btn device active" id="dDesk" onclick="setDevice('desktop')">Desktop</button><button class="btn device" id="dTab" onclick="setDevice('tablet')">Tablet</button><button class="btn device" id="dMob" onclick="setDevice('mobile')">Mobile</button><span style="width:20px"></span><button class="btn" onclick="preview()">Preview ↗</button></div>
<div class="canvasWrap"><div id="canvas" class="canvas"></div></div>
</main>

<aside class="right"><div class="tabbar"><button id="aiTab" class="active" onclick="rightTab('ai')">AI BUILDER</button><button id="editTab" onclick="rightTab('edit')">EDITOR</button></div><div class="rightPad"><div id="rightPanel"></div></div></aside>
</div></div>
<div id="toast" class="toast"></div>

<script>
const THEMES={
"Med Spa":{brand:"#29655f",soft:"#dde8e3",bg:"#f7f5f0",gold:"#c8a96b",fonts:"Cormorant Garamond + Inter",cta:"Book Your Consultation"},
"SaaS":{brand:"#3157d5",soft:"#e8edff",bg:"#f7f9ff",gold:"#7c3aed",fonts:"Sora + Inter",cta:"Start Free"},
"Real Estate":{brand:"#24333a",soft:"#e9edef",bg:"#faf8f4",gold:"#b89b5e",fonts:"Playfair Display + Manrope",cta:"Book a Consultation"},
"Restaurant":{brand:"#8b3f2f",soft:"#f5e6dc",bg:"#fffaf5",gold:"#c28b52",fonts:"DM Serif Display + Lato",cta:"Reserve Your Table"},
"Fitness":{brand:"#173b3f",soft:"#dceff0",bg:"#f5f8f8",gold:"#d7a928",fonts:"Space Grotesk + Inter",cta:"Get Started"},
"Law Firm":{brand:"#203447",soft:"#e5ebef",bg:"#f7f7f5",gold:"#a98952",fonts:"Libre Baskerville + Source Sans 3",cta:"Book a Consultation"},
"E-commerce":{brand:"#5b35d5",soft:"#eee9ff",bg:"#faf9ff",gold:"#ef8b2e",fonts:"Poppins + Inter",cta:"Shop Now"},
"Dental":{brand:"#197a8c",soft:"#e1f3f5",bg:"#f7fcfc",gold:"#4aa7b8",fonts:"DM Sans + Inter",cta:"Book Your Visit"},
"Coaching":{brand:"#684c8f",soft:"#eee7f4",bg:"#fbf8fc",gold:"#c69b64",fonts:"Cormorant Garamond + Manrope",cta:"Book a Discovery Call"}
};
let S={brand:"Lumière Med Spa",industry:"Med Spa",product:"Skin Rejuvenation Treatment",audience:"Women 30–50 seeking premium skin care",position:"Luxury",pages:[],page:0,selected:null,device:"desktop",history:[]};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function theme(){let t=THEMES[S.industry]||THEMES["Med Spa"];for(let [k,v] of Object.entries({brand:t.brand,brand2:t.soft,bg:t.bg,gold:t.gold}))document.documentElement.style.setProperty("--"+k,v)}
function offer(){let p=S.product,a=S.audience;let m={
"Med Spa":`A personalized ${p} experience designed for ${a}, combining expert guidance with refined, natural-looking results.`,
"SaaS":`A simpler way to use ${p} to save time, reduce friction, and help ${a} move faster.`,
"Real Estate":`A premium ${p} approach helping ${a} make confident decisions with clarity from start to finish.`,
"Restaurant":`An elevated ${p} experience crafted for ${a}, memorable occasions, and effortless hospitality.`,
"Fitness":`A practical ${p} system built for ${a} who want consistency, confidence, and measurable progress.`,
"Law Firm":`Clear, experienced guidance around ${p}, built for ${a} who want a confident next step.`,
"E-commerce":`Discover ${p}, selected for ${a} who value quality, ease, and a better everyday experience.`,
"Dental":`Comfort-focused ${p} care created for ${a}, with a clear and confidence-building patient experience.`,
"Coaching":`A focused ${p} experience for ${a}, turning clarity into practical action with expert guidance.`};return m[S.industry]||m["Med Spa"]}
function body(type){let p=S.product;return {
hero:offer(),problem:`Choosing ${p} should feel clear. Your customer needs to understand the value, trust the process, and know exactly what to do next.`,
benefits:`A streamlined experience built around what matters most: clarity, confidence, thoughtful guidance, and a frictionless next step.`,
proof:`A premium experience designed to make ${p} simpler, clearer, and more worthwhile for the right customer.`,
visual:`Use these visual concepts as placeholders. Replace them with real photography, product images, portfolio work, or before-and-after assets.`,
offer:`Start with a clear next step and discover whether ${p} is right for you. No unnecessary friction—just a simple path forward.`,
faq:`We answer the important questions before asking for commitment, so the customer knows what to expect.`,
cta:`Your next step starts here. ${THEMES[S.industry].cta}.`
}[type]||""}
function makePage(name="Home"){let types=["hero","problem","benefits","proof"];if(S.industry==="Med Spa"||S.industry==="E-commerce"||S.industry==="Restaurant")types.push("visual");types.push("offer","faq","cta");return {name,sections:types.map(type=>({id:uid(),type,title:title(type),body:body(type),button:THEMES[S.industry].cta,items:["Personalized experience","Expert guidance","Designed around your goals"]}))}}
function title(type){return {hero:`${S.product}, reimagined for ${S.audience}.`,problem:"The old way should not be the only way.",benefits:`Why choose our ${S.product}?`,proof:"Trusted by people who value the difference.",visual:"See the experience for yourself.",offer:`Ready for a better ${S.product} experience?`,faq:"Questions, answered.",cta:"Take the next step with confidence."}[type]}
function uid(){return Math.random().toString(36).slice(2,10)}
function current(){return S.pages[S.page]}
function snapshot(){S.history.push(JSON.stringify({pages:S.pages,page:S.page,selected:S.selected}));if(S.history.length>20)S.history.shift()}
function buildFresh(){snapshot();S.pages=[makePage("Home")];S.page=0;S.selected=S.pages[0].sections[0].id;theme();render();toast("New AI-generated project created")}
function render(){theme();document.getElementById("projectName").textContent=S.brand;document.getElementById("projectMeta").textContent=S.industry+" · AI Funnel";renderPages();renderTree();renderCanvas();renderRight()}
function renderPages(){pages.innerHTML=S.pages.map((p,i)=>`<button class="pageBtn ${i===S.page?"active":""}" onclick="selectPage(${i})">📄 ${esc(p.name)}</button>`).join("")}
function renderTree(){sectionTree.innerHTML=current().sections.map((s,i)=>`<div class="sectionRow"><button onclick="selectSection('${s.id}')">${i+1}. ${s.type}</button><button class="tiny" onclick="moveSection('${s.id}',-1)">↑</button><button class="tiny" onclick="moveSection('${s.id}',1)">↓</button></div>`).join("")}
function selectPage(i){S.page=i;S.selected=current().sections[0]?.id;render()}
function selectSection(id){S.selected=id;rightTab("edit");renderCanvas();renderTree();renderRight()}
function sectionHTML(s){let sel=S.selected===s.id?" selected":"";let tools=`<div class="sectionTools"><button class="toolBtn" onclick="moveSection('${s.id}',-1);event.stopPropagation()">↑</button><button class="toolBtn" onclick="moveSection('${s.id}',1);event.stopPropagation()">↓</button><button class="toolBtn" onclick="duplicateSection('${s.id}');event.stopPropagation()">⧉</button><button class="toolBtn" onclick="deleteSection('${s.id}');event.stopPropagation()">×</button></div>`;
let t=THEMES[S.industry], visual=svg(S.product);
if(s.type==="hero")return `<section class="section${sel}" onclick="selectSection('${s.id}')">${tools}<div class="hero"><div><div class="eyebrow">${esc(S.brand)}</div><h1>${esc(s.title)}</h1><p>${esc(s.body)}</p><a class="cta">${esc(s.button)}</a></div><div class="visual">${visual}</div></div></section>`;
let content="";
if(s.type==="benefits")content=`<div class="grid">${s.items.map(x=>`<div class="card"><b>${esc(x)}</b><p class="body">${esc(s.body)}</p></div>`).join("")}</div>`;
if(s.type==="proof")content=`<p class="quote">“${esc(s.body)}”</p><small>★★★★★ Customer experience framework</small>`;
if(s.type==="visual")content=`<div class="gallery">${[1,2,3].map(n=>`<div class="visual">${svg(S.product+" concept "+n)}</div>`).join("")}</div>`;
if(s.type==="faq")content=`<div class="faq"><div class="card"><b>What makes this different?</b><p class="body">${esc(s.body)}</p></div><div class="card"><b>How do I get started?</b><p class="body">${esc(s.body)}</p></div></div>`;
return `<section class="section${sel}" onclick="selectSection('${s.id}')">${tools}<div class="${s.type==="offer"||s.type==="cta"?"offer":"block"}"><div class="center"><span class="badge">${esc(S.industry)}</span><h2>${esc(s.title)}</h2><p class="body">${esc(s.body)}</p>${content}<a class="cta">${esc(s.button)}</a></div></div></section>`}
function svg(label){let t=THEMES[S.industry],icons={\"Med Spa\":\"✦\",SaaS:\"⌘\",\"Real Estate\":\"⌂\",Restaurant:\"✺\",Fitness:\"◈\",\"Law Firm\":\"§\",\"E-commerce\":\"◇\",Dental:\"✧\",Coaching:\"◎\"};return `<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="480" fill="${t.soft}"/><circle cx="550" cy="110" r="125" fill="${t.brand}" opacity=".12"/><circle cx="150" cy="390" r="170" fill="${t.brand}" opacity=".08"/><rect x="85" y="80" width="530" height="320" rx="28" fill="#fff" opacity=".78"/><text x="350" y="240" text-anchor="middle" font-size="105" fill="${t.brand}" font-family="Georgia">${icons[S.industry]||"✦"}</text><text x="350" y="310" text-anchor="middle" font-size="21" fill="${t.brand}" font-family="Arial" font-weight="700">${esc(label)}</text><text x="350" y="340" text-anchor="middle" font-size="13" fill="${t.brand}" opacity=".65">Replace with your own image</text></svg>`}
function renderCanvas(){canvas.className="canvas "+S.device;canvas.innerHTML=current().sections.map(sectionHTML).join("")}
function renderRight(){let p=document.getElementById("rightPanel");if(document.getElementById("editTab").classList.contains("active"))editor(p);else ai(p)}
function rightTab(tab){aiTab.classList.toggle("active",tab==="ai");editTab.classList.toggle("active",tab==="edit");let p=document.getElementById("rightPanel");tab==="ai"?ai(p):editor(p)}
function ai(p){p.innerHTML=`<div class="panelTitle">Describe what you want</div><div id="chat" class="chat"><div class="msg ai">Hi! I'm BrandFlow AI. Tell me what to change and I'll update your website structure, copy, and styling.</div><div class="msg ai"><b>Try:</b><br>“Make the hero more luxurious.”<br>“Add a booking section.”<br>“Rewrite the offer for busy professionals.”</div></div><div class="quick"><button onclick="quick('Make the hero more premium')">Make hero premium</button><button onclick="quick('Add a booking section')">Add booking</button><button onclick="quick('Improve conversion')">Improve conversion</button><button onclick="quick('Make mobile cleaner')">Optimize mobile</button></div><div class="chatInput"><input id="aiInput" placeholder="Ask BrandFlow to change anything…" onkeydown="if(event.key==='Enter')sendAI()"><button class="btn primary" onclick="sendAI()">Send</button></div>`}
function sendAI(){let input=document.getElementById("aiInput"),q=(input?.value||"").trim();if(!q)return;chatMsg(q,"user");processAI(q);if(input)input.value=""}
function quick(q){chatMsg(q,"user");processAI(q)}
function chatMsg(x,who){let c=document.getElementById("chat");if(c){let d=document.createElement("div");d.className="msg "+who;d.textContent=x;c.appendChild(d)}}
function processAI(q){snapshot();let l=q.toLowerCase(),p=current();if(l.includes("hero")){let s=p.sections.find(x=>x.type==="hero");if(s){s.title=l.includes("premium")?`Elevated ${S.product}, designed around you.`:s.title;s.body=offer();}}if(l.includes("offer")||l.includes("conversion")){let s=p.sections.find(x=>x.type==="offer");if(s){s.title=`A clearer path to ${S.product}.`;s.body=`${offer()} ${body("offer")}`}}if(l.includes("booking")){if(!p.sections.some(x=>x.type==="booking"))p.sections.splice(p.sections.length-1,0,{id:uid(),type:"booking",title:"Ready when you are.",body:`Choose a convenient time to discuss ${S.product} and get a personalized recommendation.`,button:THEMES[S.industry].cta,items:[]});}if(l.includes("mobile"))S.device="mobile";if(l.includes("luxur")){S.position="Luxury";document.documentElement.style.setProperty("--gold",THEMES[S.industry].gold)}render();chatMsg("Done — I updated the project. You can edit the result directly or ask for another change.","ai")}
function editor(p){let s=current().sections.find(x=>x.id===S.selected);if(!s){p.innerHTML="<p class='muted'>Select a section to edit it.</p>";return}p.innerHTML=`<div class="panelTitle">Selected: ${esc(s.type)}</div><div class="field"><label>Headline</label><textarea oninput="editField('title',this.value)">${esc(s.title)}</textarea></div><div class="field"><label>Body copy</label><textarea oninput="editField('body',this.value)">${esc(s.body)}</textarea></div><div class="field"><label>CTA</label><input value="${esc(s.button)}" oninput="editField('button',this.value)"></div><div class="panelTitle">Brand</div><div class="swatches"><div class="swatch" style="background:var(--brand)"></div><div class="swatch" style="background:var(--bg)"></div><div class="swatch" style="background:var(--gold)"></div></div><p class="muted">Recommended fonts: ${esc(THEMES[S.industry].fonts)}</p><button class="btn" onclick="rightTab('ai')">✨ Ask AI to improve</button>`}
function editField(k,v){let s=current().sections.find(x=>x.id===S.selected);if(s){s[k]=v;renderCanvas()}}
function moveSection(id,d){snapshot();let a=current().sections,i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];S.selected=id;render()}
function duplicateSection(id){snapshot();let a=current().sections,i=a.findIndex(x=>x.id===id),n={...a[i],id:uid(),title:a[i].title+" — Copy"};a.splice(i+1,0,n);S.selected=n.id;render()}
function deleteSection(id){snapshot();current().sections=current().sections.filter(x=>x.id!==id);S.selected=current().sections[0]?.id;render()}
function addPage(){snapshot();S.pages.push(makePage("New Page"));S.page=S.pages.length-1;S.selected=current().sections[0].id;render()}
function duplicatePage(){snapshot();let n=JSON.parse(JSON.stringify(current()));n.name=n.name+" — Copy";n.sections.forEach(x=>x.id=uid());S.pages.splice(S.page+1,0,n);S.page++;S.selected=current().sections[0].id;render()}
function openBrand(){rightTab("edit");S.selected=null;rightPanel.innerHTML=`<div class="panelTitle">Brand System</div><div class="field"><label>Brand name</label><input value="${esc(S.brand)}" oninput="S.brand=this.value;render()"></div><div class="field"><label>Industry</label><select onchange="S.industry=this.value;buildFresh()">${Object.keys(THEMES).map(x=>`<option ${x===S.industry?"selected":""}>${x}</option>`).join("")}</select></div><p class="muted">Theme: ${THEMES[S.industry].brand}<br>Fonts: ${THEMES[S.industry].fonts}</p>`}
function openImages(){rightTab("edit");S.selected=null;rightPanel.innerHTML=`<div class="panelTitle">Image Studio</div><div class="field"><label>Image description</label><textarea id="imgPrompt">Luxury ${esc(S.industry.toLowerCase())} ${esc(S.product)} hero image</textarea></div><div class="field"><label>Style</label><select><option>Luxury editorial</option><option>Minimal</option><option>Clinical</option><option>Lifestyle</option><option>Product photography</option></select></div><button class="btn primary" onclick="toast('Image concept created — replace the placeholder with your real asset or connect an image API later.')">Generate Concept</button><p class="muted">V7 uses free browser-generated SVG concepts, so it works on GitHub Pages without an image API.</p>`}
function openSEO(){rightTab("edit");S.selected=null;let score=91+(S.audience?3:0);rightPanel.innerHTML=`<div class="panelTitle">SEO & Conversion</div><div class="score">Overall score<br><strong>${Math.min(score,98)}/100</strong></div><p class="muted">✓ Clear offer<br>✓ Primary CTA<br>✓ Customer-focused headline<br>✓ Trust/proof section<br>✓ FAQ / objection handling<br>✓ Responsive preview</p><button class="btn primary" onclick="quick('Improve conversion')">✨ Optimize with AI</button>`}
function setDevice(d){S.device=d;dDesk.classList.toggle("active",d==="desktop");dTab.classList.toggle("active",d==="tablet");dMob.classList.toggle("active",d==="mobile");renderCanvas()}
function saveProject(){localStorage.setItem("brandflowV7",JSON.stringify({...S,history:[]}));toast("Project saved in this browser")}
function loadProject(){let x=localStorage.getItem("brandflowV7");if(!x){toast("No saved project");return}S=JSON.parse(x);theme();render();toast("Project loaded")}
function undo(){let x=S.history.pop();if(!x){toast("Nothing to undo");return}let z=JSON.parse(x);S.pages=z.pages;S.page=z.page;S.selected=z.selected;render();toast("Undo complete")}
function exportProject(){let clean=document.documentElement.outerHTML;let blob=new Blob([clean],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(S.brand||"brandflow-project").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".html";a.click();toast("HTML exported")}
function preview(){let w=window.open();w.document.write(`<title>${esc(S.brand)}</title><style>${document.querySelector("style").innerHTML}</style><div class="canvas">${current().sections.map(sectionHTML).join("")}</div>`);w.document.close()}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function init(){theme();S.pages=[makePage("Home")];S.selected=S.pages[0].sections[0].id;render()}
init();
</script>
</body>
</html>
