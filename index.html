<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrandFlow V6</title>
<style>
:root{--p:#29655f;--bg:#f8f5ef;--s:#dde8e3;--ink:#263331;--gold:#c8a96b;--line:#dfe6e2}*{box-sizing:border-box}body{margin:0;background:#eef2f0;color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-weight:900}.logo span{color:var(--p)}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px}.primary{background:var(--p);color:white;border-color:var(--p)}.layout{display:grid;grid-template-columns:280px 1fr 300px;min-height:calc(100vh - 64px)}aside{background:white;padding:17px;border-right:1px solid var(--line);overflow:auto}.right{border-left:1px solid var(--line);border-right:0}.label{display:block;font-size:12px;color:#66736f;margin:11px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:white}textarea{min-height:75px;resize:vertical}h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em}.list{display:grid;gap:6px}.list button{text-align:left;border:1px solid var(--line);background:white;border-radius:8px;padding:9px}.main{padding:20px;overflow:auto}.bar{text-align:center;margin-bottom:12px}.frame{width:min(100%,980px);margin:auto;background:white;min-height:850px;box-shadow:0 12px 35px #0001}.mobile{width:390px}.sec{position:relative;border:2px solid transparent}.sec:hover,.sel{border-color:var(--p)}.tools{position:absolute;right:7px;top:7px;display:none;gap:3px;z-index:2}.sec:hover .tools,.sel .tools{display:flex}.mini{border:0;background:white;box-shadow:0 2px 7px #0002;border-radius:6px;padding:5px 7px}.hero{padding:68px 45px;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--p);font-weight:800}.hero h1,.block h2{font-family:Georgia,serif}.hero h1{font-size:50px;line-height:1.04;margin:9px 0}.hero p,.sub{color:#66736f;line-height:1.6}.visual{min-height:280px;border-radius:20px;overflow:hidden;background:var(--s)}.visual svg{width:100%;height:100%;min-height:280px}.cta{display:inline-block;margin-top:13px;padding:12px 17px;background:var(--p);color:white;border-radius:9px;text-decoration:none;font-weight:800}.block{padding:50px 42px}.block h2{font-size:33px;margin:0 0 10px}.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:23px}.card{border:1px solid var(--line);border-radius:13px;padding:18px;background:white}.quote{font:22px/1.5 Georgia,serif}.offer{padding:52px 42px;background:var(--p);color:white}.offer .sub{color:#e8f3f0}.offer .cta{background:white;color:var(--p)}.badge{display:inline-block;padding:5px 8px;background:var(--s);color:var(--p);border-radius:99px;font-size:11px;font-weight:800}.small{font-size:12px;color:#66736f;line-height:1.5}.score{background:var(--s);border-radius:11px;padding:12px}.score strong{font-size:24px}@media(max-width:1000px){.layout{grid-template-columns:230px 1fr}.right{display:none}.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="logo">Brand<span>Flow</span> <small>V6</small></div><div class="actions"><button class="btn" onclick="resetApp()">Reset</button><button class="btn" onclick="saveApp()">Save</button><button class="btn" onclick="loadApp()">Load</button><button class="btn primary" onclick="exportApp()">Export HTML</button></div></header>
<div class="layout"><aside>
<h3>Build automatically</h3>
<label class="label">Industry</label><select id="industry" onchange="build()"><option>Med Spa</option><option>SaaS</option><option>Real Estate</option><option>Restaurant</option><option>Fitness</option><option>Law Firm</option><option>E-commerce</option><option>Dental</option><option>Coaching</option></select>
<label class="label">Product / Service</label><input id="product" value="Skin Rejuvenation Treatment" oninput="debounceBuild()">
<label class="label">Target Customer</label><input id="audience" value="Women 30–50 seeking premium skin care" oninput="debounceBuild()">
<label class="label">Positioning</label><select id="position" onchange="build()"><option>Luxury</option><option>Modern</option><option>Professional</option><option>Friendly</option><option>Affordable</option><option>Bold</option></select>
<label class="label">Brand</label><input id="brand" value="Lumière Med Spa" oninput="debounceBuild()">
<button class="btn primary" style="width:100%;margin-top:13px" onclick="build()">✨ Build My Funnel</button>
<p class="small">Enter your industry and product/service. BrandFlow automatically writes an offer, creates conversion copy, chooses a visual direction, and builds editable sections.</p>
<h3>Sections</h3><div id="list" class="list"></div></aside>
<main class="main"><div class="bar"><button id="desk" class="btn primary" onclick="device('desktop')">Desktop</button><button id="mob" class="btn" onclick="device('mobile')">Mobile</button></div><div id="frame" class="frame"></div></main>
<aside class="right"><h3>Generated Strategy</h3><div id="strategy"></div><h3>Editor</h3><div id="editor" class="small">Select a section.</div></aside></div>
<script>
const C={"Med Spa":['#29655f','#dde8e3','#f8f5ef','#c8a96b','Cormorant Garamond + Inter','Book Your Consultation','spa'],"SaaS":['#3157d5','#e8edff','#f7f9ff','#7c3aed','Sora + Inter','Start Free','saas'],"Real Estate":['#24333a','#e9edef','#faf8f4','#b89b5e','Playfair Display + Manrope','Book a Consultation','home'],"Restaurant":['#8b3f2f','#f5e6dc','#fffaf5','#c28b52','DM Serif Display + Lato','Reserve Your Table','food'],"Fitness":['#173b3f','#dceff0','#f5f8f8','#d7a928','Space Grotesk + Inter','Get Started','fitness'],"Law Firm":['#203447','#e5ebef','#f7f7f5','#a98952','Libre Baskerville + Source Sans 3','Book a Consultation','law'],"E-commerce":['#5b35d5','#eee9ff','#faf9ff','#ef8b2e','Poppins + Inter','Shop Now','shop'],"Dental":['#197a8c','#e1f3f5','#f7fcfc','#4aa7b8','DM Sans + Inter','Book Your Visit','dental'],"Coaching":['#684c8f','#eee7f4','#fbf8fc','#c69b64','Cormorant Garamond + Manrope','Book a Discovery Call','coach']};
let P={brand:'Lumière Med Spa',industry:'Med Spa',product:'Skin Rejuvenation Treatment',audience:'Women 30–50 seeking premium skin care',position:'Luxury',sections:[]},selected=null,mode='desktop',timer;
function v(id){return document.getElementById(id).value}function e(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function offer(){let i=P.industry;let templates={"Med Spa":`Personalized ${P.product} designed to deliver refined, natural-looking results with a premium experience.`,"SaaS":`A simpler way to use ${P.product} to save time, reduce friction, and grow with confidence.`,"Real Estate":`A premium approach to ${P.product}, helping clients move with clarity and confidence.`,"Restaurant":`An elevated ${P.product} experience crafted for memorable moments and exceptional hospitality.`,"Fitness":`A practical ${P.product} system built to help you train consistently and see measurable progress.`,"Law Firm":`Experienced guidance for ${P.product}, with a clear strategy focused on protecting your interests.`,"E-commerce":`Discover ${P.product} selected for quality, ease, and a better everyday experience.`,"Dental":`Comfort-focused ${P.product} care designed around your needs and confidence.`,"Coaching":`A focused ${P.product} experience that turns clarity into action with guidance around your goals.`};return templates[i]}
function title(t){let p=P.product;return ({hero:`${p}, reimagined for ${P.audience}.`,problem:'The old way should not be the only way.',benefits:`Why choose our ${p}?`,proof:'Trusted by people who value the difference.',visual:'See the experience for yourself.',offer:`Ready for a better ${p} experience?`,faq:'Questions, answered.',cta:'Take the next step with confidence.'})[t]}
function body(t){let p=P.product;return ({hero:offer(),problem:`If you are looking for ${p}, you should not have to guess what works, who to trust, or what happens next.`,benefits:'Clear value, thoughtful guidance, and a streamlined experience designed around the customer.',proof:'A premium experience built to make the journey simpler, clearer, and more worthwhile.',visual:'Replace these visual concepts with your own photography, product shots, portfolio work, or before-and-after images.',offer:`Start with a clear next step. ${C[P.industry][5]} and discover whether ${p} is right for you.`,faq:'We make the process clear before asking for commitment.',cta:`Your next step starts here. ${C[P.industry][5]}.`})[t]||''}
function build(){P.industry=v('industry');P.product=v('product');P.audience=v('audience');P.position=v('position');P.brand=v('brand');P.sections=['hero','problem','benefits','proof',...(P.industry==='Med Spa'?['visual']:[]),'offer','faq','cta'].map(t=>({id:Math.random().toString(36).slice(2),type:t,title:title(t),body:body(t),button:C[P.industry][5],items:['Personalized experience','Expert guidance','Designed around your goals']}));selected=P.sections[0].id;theme();render()}
function debounceBuild(){clearTimeout(timer);timer=setTimeout(build,400)}
function theme(){let c=C[P.industry];document.documentElement.style.setProperty('--p',c[0]);document.documentElement.style.setProperty('--s',c[1]);document.documentElement.style.setProperty('--bg',c[2]);document.documentElement.style.setProperty('--gold',c[3])}
function svg(label){let c=C[P.industry],icons={spa:'✦',saas:'⌘',home:'⌂',food:'✺',fitness:'◈',law:'§',shop:'◇',dental:'✧',coach:'◎'};return `<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="480" fill="${c[1]}"/><circle cx="540" cy="120" r="125" fill="${c[0]}" opacity=".12"/><circle cx="150" cy="390" r="170" fill="${c[0]}" opacity=".08"/><rect x="90" y="85" width="520" height="310" rx="28" fill="white" opacity=".75"/><text x="350" y="245" text-anchor="middle" font-size="105" fill="${c[0]}" font-family="Georgia">${icons[c[6]]||'✦'}</text><text x="350" y="310" text-anchor="middle" font-size="21" fill="${c[0]}" font-family="Arial" font-weight="700">${e(label)}</text><text x="350" y="340" text-anchor="middle" font-size="13" fill="${c[0]}" opacity=".7">Replace with your own image</text></svg>`}
function sec(s){let sel=selected===s.id?' sel':'';let tools=`<div class="tools"><button class="mini" onclick="move('${s.id}',-1);event.stopPropagation()">↑</button><button class="mini" onclick="move('${s.id}',1);event.stopPropagation()">↓</button><button class="mini" onclick="dup('${s.id}');event.stopPropagation()">⧉</button><button class="mini" onclick="del('${s.id}');event.stopPropagation()">×</button></div>`;if(s.type==='hero')return `<section class="sec${sel}" onclick="select('${s.id}',event)">${tools}<div class="hero"><div><div class="eyebrow">${e(P.brand)}</div><h1>${e(s.title)}</h1><p>${e(s.body)}</p><a class="cta">${e(s.button)}</a></div><div class="visual">${svg(P.product)}</div></div></section>`;let content='';if(s.type==='benefits')content=`<div class="grid">${s.items.map(x=>`<div class="card"><b>${e(x)}</b><p class="sub">${e(s.body)}</p></div>`).join('')}</div>`;if(s.type==='proof')content=`<p class="quote">“${e(s.body)}”</p><small>★★★★★ Verified customer</small>`;if(s.type==='visual')content=`<div class="grid">${[1,2,3].map(n=>`<div class="visual">${svg(P.product+' concept '+n)}</div>`).join('')}</div>`;if(s.type==='faq')content=`<div class="grid"><div class="card"><b>What makes this different?</b><p class="sub">${e(s.body)}</p></div><div class="card"><b>How do I get started?</b><p class="sub">${e(s.body)}</p></div></div>`;return `<section class="sec${sel}" onclick="select('${s.id}',event)">${tools}<div class="${s.type==='offer'||s.type==='cta'?'offer':'block'}"><div class="center"><span class="badge">${e(P.industry)}</span><h2>${e(s.title)}</h2><p class="sub">${e(s.body)}</p>${content}<a class="cta">${e(s.button)}</a></div></div></section>`}
function render(){theme();frame.className='frame '+mode;frame.innerHTML=P.sections.map(sec).join('');list.innerHTML=P.sections.map((s,i)=>`<button onclick="select('${s.id}')">${i+1}. ${s.type}</button>`).join('');let c=C[P.industry];strategy.innerHTML=`<div class="score"><div>Funnel readiness</div><strong>${Math.min(98,78+(P.product?7:0)+(P.audience?7:0)+6)}/100</strong></div><p class="small"><b>Offer:</b> ${e(offer())}</p><p class="small"><b>Recommended fonts:</b> ${c[4]}</p><p class="small"><b>CTA:</b> ${c[5]}</p><p class="small"><b>Visual direction:</b> ${P.industry} concept art, replaceable with your own images.</p>`;editor.innerHTML='Select a section.';let s=P.sections.find(x=>x.id===selected);if(s)editor.innerHTML=`<label class="label">Title</label><textarea oninput="edit('title',this.value)">${e(s.title)}</textarea><label class="label">Body</label><textarea oninput="edit('body',this.value)">${e(s.body)}</textarea><label class="label">CTA</label><input value="${e(s.button)}" oninput="edit('button',this.value)"><p class="small">All generated copy is editable. Visuals are self-contained concept placeholders you can replace with real images.</p>`}
function select(id,x){selected=id;render();if(x)x.stopPropagation()}function edit(k,val){let s=P.sections.find(x=>x.id===selected);if(s){s[k]=val;frame.innerHTML=P.sections.map(sec).join('')}}function move(id,d){let i=P.sections.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=P.sections.length)return;[P.sections[i],P.sections[j]]=[P.sections[j],P.sections[i]];render()}function dup(id){let s=P.sections.find(x=>x.id===id),n={...s,id:Math.random().toString(36).slice(2),title:s.title+' — Copy'};P.sections.splice(P.sections.indexOf(s)+1,0,n);render()}function del(id){P.sections=P.sections.filter(x=>x.id!==id);selected=P.sections[0]?.id;render()}function device(x){mode=x;desk.className='btn'+(x==='desktop'?' primary':'');mob.className='btn'+(x==='mobile'?' primary':'');render()}function saveApp(){localStorage.setItem('brandflowV6',JSON.stringify(P));alert('Saved in this browser.')}function loadApp(){let x=localStorage.getItem('brandflowV6');if(x){P=JSON.parse(x);sync();render()}else alert('No saved project.')}function sync(){industry.value=P.industry;product.value=P.product;audience.value=P.audience;position.value=P.position;brand.value=P.brand}function resetApp(){P={brand:'Lumière Med Spa',industry:'Med Spa',product:'Skin Rejuvenation Treatment',audience:'Women 30–50 seeking premium skin care',position:'Luxury',sections:[]};sync();build()}function exportApp(){let out='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+e(P.brand)+'</title><style>'+document.querySelector('style').innerHTML+'</style></head><body><div id="frame" class="frame">'+P.sections.map(sec).join('')+'</div></body></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download=(P.brand||'funnel')+'.html';a.click()}build();
</script></body></html>
