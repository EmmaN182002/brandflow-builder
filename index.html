<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrandFlow V8 — AI Website & Funnel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#29655f;--soft:#dde8e3;--bg:#f7f5f0;--ink:#263331;--muted:#71807b;--line:#e3e8e5;--gold:#c8a96b;--heading:"Cormorant Garamond",Georgia,serif;--body:"Inter",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#eef1ef;color:var(--ink);font-family:var(--body)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:60px 1fr;overflow:hidden}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}.brand{font-weight:900;font-size:17px}.brand i{font-style:normal;color:var(--brand)}.crumb{color:var(--muted);font-size:12px;margin-left:10px}.topActions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 11px}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.workspace{display:grid;grid-template-columns:250px minmax(400px,1fr) 350px;min-height:0}.left,.right{background:#fff;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.pad{padding:15px}.navTitle,.panelTitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#87928e;font-weight:800;margin:10px 0}.project{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:14px;background:#fafcfb}.project strong{display:block}.project small{color:var(--muted)}.tree button,.pageBtn{width:100%;text-align:left;background:transparent;border:0;padding:8px 9px;border-radius:7px;color:var(--ink)}.tree button:hover,.pageBtn:hover,.pageBtn.active{background:var(--soft);color:var(--brand)}.sectionRow{display:flex;gap:4px}.sectionRow button:first-child{flex:1}.tiny{border:0;background:#f4f6f5;border-radius:6px;padding:5px 7px}
.main{min-width:0;display:flex;flex-direction:column;background:#e9edeb}.toolbar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px}.device.active{background:var(--brand);color:#fff;border-color:var(--brand)}.canvasWrap{flex:1;overflow:auto;padding:25px}.canvas{width:min(100%,980px);margin:auto;background:#fff;box-shadow:0 18px 55px #19382d16;min-height:1000px}.canvas.mobile{width:390px}.canvas.tablet{width:700px}
.section{position:relative;border:2px solid transparent}.section:hover,.section.selected{border-color:var(--brand)}.sectionTools{position:absolute;right:9px;top:9px;display:none;z-index:5;gap:4px}.section:hover .sectionTools,.section.selected .sectionTools{display:flex}.toolBtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 7px;box-shadow:0 2px 8px #0001}
.hero{padding:72px 54px;background:var(--bg);display:grid;grid-template-columns:1.08fr .92fr;gap:35px;align-items:center}.eyebrow{color:var(--brand);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hero h1,.section h2{font-family:var(--heading)}.hero h1{font-size:52px;line-height:1.02;margin:10px 0 15px}.hero p,.body{color:var(--muted);line-height:1.7}.cta{display:inline-block;margin-top:15px;background:var(--brand);color:#fff;text-decoration:none;border-radius:8px;padding:12px 18px;font-weight:800}.visual{background:var(--soft);border-radius:18px;overflow:hidden;min-height:300px}.visual img{display:block;width:100%;height:100%;min-height:300px;object-fit:cover}.visual svg{display:block;width:100%;height:100%;min-height:300px}.block{padding:55px 45px}.block h2{font-size:34px;margin:0 0 12px}.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:25px}.card{border:1px solid var(--line);border-radius:13px;padding:19px;background:#fff}.card b{display:block;margin-bottom:7px}.offer{background:var(--brand);color:#fff;padding:55px 45px}.offer .body{color:#eaf2f0}.offer .cta{background:#fff;color:var(--brand)}.quote{font:22px/1.5 var(--heading)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.gallery .visual{min-height:170px}.gallery .visual img{min-height:170px}.faq{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tabbar{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}.tabbar button{flex:1;border:0;background:#fff;padding:12px 4px;color:var(--muted);font-size:12px}.tabbar button.active{color:var(--brand);box-shadow:inset 0 -2px var(--brand)}.field{margin-bottom:13px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.field textarea{min-height:85px;resize:vertical}.fontPreview{padding:12px;border:1px solid var(--line);border-radius:9px;margin-top:7px}.swatches{display:flex;gap:7px}.swatch{height:32px;flex:1;border-radius:7px;border:1px solid #fff;box-shadow:0 0 0 1px var(--line)}.chat{display:flex;flex-direction:column;gap:9px}.msg{padding:10px 11px;border-radius:11px;line-height:1.5}.ai{background:#f2f5f3}.user{background:var(--brand);color:#fff;align-self:flex-end;max-width:95%}.chatInput{display:flex;gap:6px;margin-top:9px}.chatInput input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px}.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.quick button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 9px;font-size:11px}.upload{border:2px dashed #cbd7d3;border-radius:11px;padding:18px;text-align:center;background:#fafcfb}.upload.drag{border-color:var(--brand);background:var(--soft)}.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f4f6f5}.thumb img{width:100%;height:90px;object-fit:cover;display:block}.thumb button{position:absolute;right:4px;top:4px;border:0;background:#fff;border-radius:5px;padding:3px 6px}.thumb .use{position:static;width:100%;border-radius:0;background:#fff;padding:6px;color:var(--brand);font-size:11px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.score{background:var(--soft);padding:12px;border-radius:10px}.score strong{font-size:23px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182b28;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:50}
@media(max-width:1100px){.workspace{grid-template-columns:220px 1fr}.right{display:none}}@media(max-width:720px){.workspace{grid-template-columns:1fr}.left{display:none}.hero{grid-template-columns:1fr;padding:45px 25px}.hero h1{font-size:40px}.grid,.gallery,.faq{grid-template-columns:1fr}.canvasWrap{padding:10px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div><span class="brand">Brand<i>Flow</i></span><span class="crumb">AI Website & Funnel Studio · V8</span></div><div class="topActions"><button class="btn" onclick="saveProject()">Save</button><button class="btn" onclick="loadProject()">Load</button><button class="btn" onclick="undo()">Undo</button><button class="btn primary" onclick="exportProject()">Export HTML</button></div></header>
<div class="workspace">
<aside class="left"><div class="pad"><div class="project"><strong id="projectName"></strong><small id="projectMeta"></small></div><div class="navTitle">Pages</div><div id="pages"></div><div class="navTitle">Sections</div><div id="sectionTree" class="tree"></div><div class="navTitle">Brand</div><div class="tree"><button onclick="openBrand()">🎨 Colors & Fonts</button><button onclick="openImages()">🖼️ Upload Images</button><button onclick="openSEO()">🔍 SEO & Conversion</button></div><div class="navTitle">Project</div><div class="tree"><button onclick="addPage()">＋ New Page</button><button onclick="duplicatePage()">⧉ Duplicate Page</button></div></div></aside>
<main class="main"><div class="toolbar"><button class="btn device active" id="dDesk" onclick="setDevice('desktop')">Desktop</button><button class="btn device" id="dTab" onclick="setDevice('tablet')">Tablet</button><button class="btn device" id="dMob" onclick="setDevice('mobile')">Mobile</button><span style="width:20px"></span><button class="btn" onclick="preview()">Preview ↗</button></div><div class="canvasWrap"><div id="canvas" class="canvas"></div></div></main>
<aside class="right"><div class="tabbar"><button id="aiTab" class="active" onclick="rightTab('ai')">AI BUILDER</button><button id="editTab" onclick="rightTab('edit')">EDITOR</button></div><div class="pad"><div id="rightPanel"></div></div></aside>
</div></div><div id="toast" class="toast"></div>
<script>
const THEMES={
"Med Spa":{brand:"#29655f",soft:"#dde8e3",bg:"#f7f5f0",gold:"#c8a96b",heading:"Cormorant Garamond",body:"Inter",cta:"Book Your Consultation"},
"SaaS":{brand:"#3157d5",soft:"#e8edff",bg:"#f7f9ff",gold:"#7c3aed",heading:"Sora",body:"Inter",cta:"Start Free"},
"Real Estate":{brand:"#24333a",soft:"#e9edef",bg:"#faf8f4",gold:"#b89b5e",heading:"Playfair Display",body:"Manrope",cta:"Book a Consultation"},
"Restaurant":{brand:"#8b3f2f",soft:"#f5e6dc",bg:"#fffaf5",gold:"#c28b52",heading:"DM Serif Display",body:"Lato",cta:"Reserve Your Table"},
"Fitness":{brand:"#173b3f",soft:"#dceff0",bg:"#f5f8f8",gold:"#d7a928",heading:"Space Grotesk",body:"Inter",cta:"Get Started"},
"Law Firm":{brand:"#203447",soft:"#e5ebef",bg:"#f7f7f5",gold:"#a98952",heading:"Libre Baskerville",body:"Source Sans 3",cta:"Book a Consultation"},
"E-commerce":{brand:"#5b35d5",soft:"#eee9ff",bg:"#faf9ff",gold:"#ef8b2e",heading:"Poppins",body:"Inter",cta:"Shop Now"},
"Dental":{brand:"#197a8c",soft:"#e1f3f5",bg:"#f7fcfc",gold:"#4aa7b8",heading:"DM Sans",body:"Inter",cta:"Book Your Visit"},
"Coaching":{brand:"#684c8f",soft:"#eee7f4",bg:"#fbf8fc",gold:"#c69b64",heading:"Cormorant Garamond",body:"Manrope",cta:"Book a Discovery Call"}};
const FONTS=["Inter","Manrope","DM Sans","Montserrat","Poppins","Sora","Space Grotesk","Cormorant Garamond","Playfair Display","DM Serif Display","Libre Baskerville","Georgia","Arial","system-ui"];
let S={brand:"Lumière Med Spa",industry:"Med Spa",product:"Skin Rejuvenation Treatment",audience:"Women 30–50 seeking premium skin care",position:"Luxury",headingFont:"Cormorant Garamond",bodyFont:"Inter",pages:[],page:0,selected:null,device:"desktop",images:[],history:[]};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function uid(){return Math.random().toString(36).slice(2,10)}function current(){return S.pages[S.page]}function snap(){S.history.push(JSON.stringify({pages:S.pages,page:S.page,selected:S.selected,headingFont:S.headingFont,bodyFont:S.bodyFont}));if(S.history.length>20)S.history.shift()}
function theme(){let t=THEMES[S.industry]||THEMES["Med Spa"];document.documentElement.style.setProperty("--brand",t.brand);document.documentElement.style.setProperty("--soft",t.soft);document.documentElement.style.setProperty("--bg",t.bg);document.documentElement.style.setProperty("--gold",t.gold);document.documentElement.style.setProperty("--heading",`"${S.headingFont||t.heading}",Georgia,serif`);document.documentElement.style.setProperty("--body",`"${S.bodyFont||t.body}",Arial,sans-serif`)}
function offer(){let p=S.product,a=S.audience;return ({'Med Spa':`A personalized ${p} experience designed for ${a}, combining expert guidance with refined, natural-looking results.`,'SaaS':`A simpler way to use ${p} to save time, reduce friction, and help ${a} move faster.`,'Real Estate':`A premium ${p} approach helping ${a} make confident decisions with clarity from start to finish.`,'Restaurant':`An elevated ${p} experience crafted for ${a}, memorable occasions, and effortless hospitality.`,'Fitness':`A practical ${p} system built for ${a} who want consistency, confidence, and measurable progress.`,'Law Firm':`Clear, experienced guidance around ${p}, built for ${a} who want a confident next step.`,'E-commerce':`Discover ${p}, selected for ${a} who value quality, ease, and a better everyday experience.`,'Dental':`Comfort-focused ${p} care created for ${a}, with a clear and confidence-building patient experience.`,'Coaching':`A focused ${p} experience for ${a}, turning clarity into practical action with expert guidance.`}[S.industry])}
function title(t){return {hero:`${S.product}, reimagined for ${S.audience}.`,problem:"The old way should not be the only way.",benefits:`Why choose our ${S.product}?`,proof:"Trusted by people who value the difference.",visual:"See the experience for yourself.",offer:`Ready for a better ${S.product} experience?`,faq:"Questions, answered.",cta:"Take the next step with confidence."}[t]}
function body(t){return {hero:offer(),problem:`Choosing ${S.product} should feel clear. Your customer needs to understand the value, trust the process, and know exactly what to do next.`,benefits:`A streamlined experience built around clarity, confidence, thoughtful guidance, and a frictionless next step.`,proof:`A premium experience designed to make ${S.product} simpler, clearer, and more worthwhile for the right customer.`,visual:`Replace these visual concepts with your own photography, product images, portfolio work, or before-and-after assets.`,offer:`Start with a clear next step and discover whether ${S.product} is right for you. No unnecessary friction—just a simple path forward.`,faq:`We answer the important questions before asking for commitment, so the customer knows what to expect.`,cta:`Your next step starts here. ${THEMES[S.industry].cta}.`}[t]||""}
function makePage(name){let types=["hero","problem","benefits","proof"];if(["Med Spa","E-commerce","Restaurant","Real Estate"].includes(S.industry))types.push("visual");types.push("offer","faq","cta");return{name,sections:types.map(type=>({id:uid(),type,title:title(type),body:body(type),button:THEMES[S.industry].cta,items:["Personalized experience","Expert guidance","Designed around your goals"],imageId:null}))}}
function buildFresh(){snap();S.pages=[makePage("Home")];S.page=0;S.selected=S.pages[0].sections[0].id;theme();render();toast("Generated a fresh funnel")}
function render(){theme();projectName.textContent=S.brand;projectMeta.textContent=S.industry+" · AI Website & Funnel";pages.innerHTML=S.pages.map((p,i)=>`<button class="pageBtn ${i===S.page?"active":""}" onclick="selectPage(${i})">📄 ${esc(p.name)}</button>`).join("");sectionTree.innerHTML=current().sections.map((s,i)=>`<div class="sectionRow"><button onclick="selectSection('${s.id}')">${i+1}. ${s.type}</button><button class="tiny" onclick="moveSection('${s.id}',-1)">↑</button><button class="tiny" onclick="moveSection('${s.id}',1)">↓</button></div>`).join("");renderCanvas();renderRight()}
function renderCanvas(){canvas.className="canvas "+S.device;canvas.innerHTML=current().sections.map(sectionHTML).join("")}
function imgFor(s){return S.images.find(x=>x.id===s.imageId)}
function sectionImage(s,label){let im=imgFor(s);return im?`<img src="${im.data}" alt="${esc(label)}">`:svg(label)}
function sectionHTML(s){let sel=S.selected===s.id?" selected":"";let tools=`<div class="sectionTools"><button class="toolBtn" onclick="moveSection('${s.id}',-1);event.stopPropagation()">↑</button><button class="toolBtn" onclick="moveSection('${s.id}',1);event.stopPropagation()">↓</button><button class="toolBtn" onclick="duplicateSection('${s.id}');event.stopPropagation()">⧉</button><button class="toolBtn" onclick="deleteSection('${s.id}');event.stopPropagation()">×</button></div>`;
if(s.type==="hero")return `<section class="section${sel}" onclick="selectSection('${s.id}')">${tools}<div class="hero"><div><div class="eyebrow">${esc(S.brand)}</div><h1>${esc(s.title)}</h1><p>${esc(s.body)}</p><a class="cta">${esc(s.button)}</a></div><div class="visual">${sectionImage(s,S.product)}</div></div></section>`;
let content="";if(s.type==="benefits")content=`<div class="grid">${s.items.map(x=>`<div class="card"><b>${esc(x)}</b><p class="body">${esc(s.body)}</p></div>`).join("")}</div>`;if(s.type==="proof")content=`<p class="quote">“${esc(s.body)}”</p><small>★★★★★ Customer experience framework</small>`;if(s.type==="visual")content=`<div class="gallery">${[0,1,2].map((_,n)=>`<div class="visual">${S.images[n]?`<img src="${S.images[n].data}" alt="">`:svg(S.product+" concept "+(n+1))}</div>`).join("")}</div>`;if(s.type==="faq")content=`<div class="faq"><div class="card"><b>What makes this different?</b><p class="body">${esc(s.body)}</p></div><div class="card"><b>How do I get started?</b><p class="body">${esc(s.body)}</p></div></div>`;return `<section class="section${sel}" onclick="selectSection('${s.id}')">${tools}<div class="${s.type==="offer"||s.type==="cta"?"offer":"block"}"><div class="center"><span class="badge">${esc(S.industry)}</span><h2>${esc(s.title)}</h2><p class="body">${esc(s.body)}</p>${content}<a class="cta">${esc(s.button)}</a></div></div></section>`}
function svg(label){let t=THEMES[S.industry],icons={"Med Spa":"✦",SaaS:"⌘","Real Estate":"⌂",Restaurant:"✺",Fitness:"◈","Law Firm":"§","E-commerce":"◇",Dental:"✧",Coaching:"◎"};return `<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="480" fill="${t.soft}"/><circle cx="550" cy="110" r="125" fill="${t.brand}" opacity=".12"/><circle cx="150" cy="390" r="170" fill="${t.brand}" opacity=".08"/><rect x="85" y="80" width="530" height="320" rx="28" fill="#fff" opacity=".78"/><text x="350" y="240" text-anchor="middle" font-size="105" fill="${t.brand}" font-family="Georgia">${icons[S.industry]||"✦"}</text><text x="350" y="310" text-anchor="middle" font-size="21" fill="${t.brand}" font-family="Arial" font-weight="700">${esc(label)}</text><text x="350" y="340" text-anchor="middle" font-size="13" fill="${t.brand}" opacity=".65">Click Upload Images to replace this</text></svg>`}
function renderRight(){let p=rightPanel;if(editTab.classList.contains("active"))editor(p);else ai(p)}
function rightTab(x){aiTab.classList.toggle("active",x==="ai");editTab.classList.toggle("active",x==="edit");renderRight()}
function ai(p){p.innerHTML=`<div class="panelTitle">Describe what you want</div><div id="chat" class="chat"><div class="msg ai">Tell me what to change. I'll update the editable funnel.</div><div class="msg ai"><b>Try:</b><br>“Make the hero more luxurious.”<br>“Add a booking section.”<br>“Rewrite the offer.”<br>“Make the mobile layout cleaner.”</div></div><div class="quick"><button onclick="quick('Make the hero more premium')">Premium hero</button><button onclick="quick('Add a booking section')">Add booking</button><button onclick="quick('Improve conversion')">Improve conversion</button><button onclick="quick('Make mobile cleaner')">Optimize mobile</button></div><div class="chatInput"><input id="aiInput" placeholder="Ask BrandFlow…" onkeydown="if(event.key==='Enter')sendAI()"><button class="btn primary" onclick="sendAI()">Send</button></div>`}
function sendAI(){let q=(aiInput?.value||"").trim();if(!q)return;chatMsg(q,"user");processAI(q);aiInput.value=""}function quick(q){chatMsg(q,"user");processAI(q)}function chatMsg(x,w){let c=document.getElementById("chat");if(c){let d=document.createElement("div");d.className="msg "+w;d.textContent=x;c.appendChild(d)}}
function processAI(q){snap();let l=q.toLowerCase(),p=current();if(l.includes("hero")){let s=p.sections.find(x=>x.type==="hero");if(s){s.title=l.includes("premium")?`Elevated ${S.product}, designed around you.`:s.title;s.body=offer()}}if(l.includes("offer")||l.includes("conversion")){let s=p.sections.find(x=>x.type==="offer");if(s){s.title=`A clearer path to ${S.product}.`;s.body=offer()+" "+body("offer")}}if(l.includes("booking")&&!p.sections.some(x=>x.type==="booking"))p.sections.splice(p.sections.length-1,0,{id:uid(),type:"booking",title:"Ready when you are.",body:`Choose a convenient time to discuss ${S.product} and get a personalized recommendation.`,button:THEMES[S.industry].cta,items:[],imageId:null});if(l.includes("mobile"))S.device="mobile";render();chatMsg("Done — the project has been updated.","ai")}
function editor(p){let s=current().sections.find(x=>x.id===S.selected);if(!s){p.innerHTML=`<div class="panelTitle">Brand & Design</div><button class="btn primary" onclick="openBrand()">Open Brand Controls</button><button class="btn" style="margin-left:5px" onclick="openImages()">Upload Images</button>`;return}let imageOptions=S.images.map(x=>`<option value="${x.id}" ${s.imageId===x.id?"selected":""}>${esc(x.name)}</option>`).join("");p.innerHTML=`<div class="panelTitle">Selected: ${esc(s.type)}</div><div class="field"><label>Headline</label><textarea oninput="editField('title',this.value)">${esc(s.title)}</textarea></div><div class="field"><label>Body copy</label><textarea oninput="editField('body',this.value)">${esc(s.body)}</textarea></div><div class="field"><label>CTA</label><input value="${esc(s.button)}" oninput="editField('button',this.value)"></div><div class="field"><label>Section image</label><select onchange="assignImage(this.value)"><option value="">Use generated placeholder</option>${imageOptions}</select></div><button class="btn" onclick="openImages()">🖼️ Upload / Manage Images</button><div class="panelTitle">Typography</div><div class="field"><label>Heading font</label><select onchange="S.headingFont=this.value;theme();renderCanvas()">${FONTS.map(f=>`<option ${S.headingFont===f?"selected":""}>${f}</option>`).join("")}</select></div><div class="field"><label>Body font</label><select onchange="S.bodyFont=this.value;theme();renderCanvas()">${FONTS.map(f=>`<option ${S.bodyFont===f?"selected":""}>${f}</option>`).join("")}</select></div><div class="fontPreview" style="font-family:'${esc(S.headingFont)}'"><strong>Heading preview</strong><br>${esc(S.product)}</div><div class="fontPreview" style="font-family:'${esc(S.bodyFont)}'">Body preview — clear, modern, readable copy.</div>`}
function editField(k,v){snap();let s=current().sections.find(x=>x.id===S.selected);if(s){s[k]=v;renderCanvas()}}function assignImage(id){snap();let s=current().sections.find(x=>x.id===S.selected);if(s){s.imageId=id||null;renderCanvas()}}
function openBrand(){rightTab("edit");S.selected=null;rightPanel.innerHTML=`<div class="panelTitle">Brand System</div><div class="field"><label>Brand name</label><input value="${esc(S.brand)}" oninput="S.brand=this.value;render()"></div><div class="field"><label>Industry</label><select onchange="S.industry=this.value;S.headingFont=THEMES[this.value].heading;S.bodyFont=THEMES[this.value].body;buildFresh()">${Object.keys(THEMES).map(x=>`<option ${x===S.industry?"selected":""}>${x}</option>`).join("")}</select></div><div class="panelTitle">Typography</div><div class="field"><label>Heading font</label><select onchange="S.headingFont=this.value;theme();renderCanvas()">${FONTS.map(f=>`<option ${S.headingFont===f?"selected":""}>${f}</option>`).join("")}</select></div><div class="field"><label>Body font</label><select onchange="S.bodyFont=this.value;theme();renderCanvas()">${FONTS.map(f=>`<option ${S.bodyFont===f?"selected":""}>${f}</option>`).join("")}</select></div><div class="fontPreview" style="font-family:'${esc(S.headingFont)}';font-size:25px">Lumière Med Spa</div><div class="fontPreview" style="font-family:'${esc(S.bodyFont)}'">Premium, clear and conversion-focused body copy.</div><div class="panelTitle">Colors</div><div class="swatches"><div class="swatch" style="background:var(--brand)"></div><div class="swatch" style="background:var(--soft)"></div><div class="swatch" style="background:var(--gold)"></div><div class="swatch" style="background:var(--bg)"></div></div><p class="muted">Recommended pairing for ${esc(S.industry)}: ${esc(THEMES[S.industry].heading)} + ${esc(THEMES[S.industry].body)}.</p>`}
function openImages(){rightTab("edit");S.selected=null;rightPanel.innerHTML=`<div class="panelTitle">Image Studio</div><div id="drop" class="upload"><b>Drag & drop images here</b><br><span class="muted">or choose files from your computer</span><br><input id="fileInput" type="file" accept="image/*" multiple style="margin-top:10px"></div><div class="muted" style="margin-top:8px">Images stay in your browser. JPG, PNG, WebP and other browser-supported images work. Nothing is uploaded to a paid server.</div><div id="thumbs" class="thumbs"></div>`;fileInput.onchange=e=>handleFiles(e.target.files);let d=document.getElementById("drop");d.ondragover=e=>{e.preventDefault();d.classList.add("drag")};d.ondragleave=()=>d.classList.remove("drag");d.ondrop=e=>{e.preventDefault();d.classList.remove("drag");handleFiles(e.dataTransfer.files)};renderThumbs()}
function handleFiles(files){[...files].filter(f=>f.type.startsWith("image/")).forEach(f=>{let r=new FileReader();r.onload=()=>{S.images.push({id:uid(),name:f.name,data:r.result});renderThumbs();toast(f.name+" added")};r.readAsDataURL(f)})}
function renderThumbs(){let t=document.getElementById("thumbs");if(!t)return;t.innerHTML=S.images.map(x=>`<div class="thumb"><img src="${x.data}" alt=""><button onclick="removeImage('${x.id}')">×</button><button class="use" onclick="useImage('${x.id}')">Use in selected section</button></div>`).join("")}
function removeImage(id){snap();S.images=S.images.filter(x=>x.id!==id);S.pages.forEach(p=>p.sections.forEach(s=>{if(s.imageId===id)s.imageId=null}));renderThumbs();renderCanvas()}function useImage(id){let s=current().sections.find(x=>x.id===S.selected);if(!s){toast("Select a section first");return}snap();s.imageId=id;renderCanvas();toast("Image applied")}
function openSEO(){rightTab("edit");S.selected=null;rightPanel.innerHTML=`<div class="panelTitle">SEO & Conversion</div><div class="score">Overall score<br><strong>94/100</strong></div><p class="muted">✓ Clear offer<br>✓ Primary CTA<br>✓ Customer-focused headline<br>✓ Proof section<br>✓ FAQ / objections<br>✓ Responsive preview<br>✓ Custom images<br>✓ Custom typography</p><button class="btn primary" onclick="quick('Improve conversion')">✨ Optimize with AI</button>`}
function selectSection(id){S.selected=id;rightTab("edit");renderCanvas();renderTree()}function renderTree(){sectionTree.innerHTML=current().sections.map((s,i)=>`<div class="sectionRow"><button onclick="selectSection('${s.id}')">${i+1}. ${s.type}</button><button class="tiny" onclick="moveSection('${s.id}',-1)">↑</button><button class="tiny" onclick="moveSection('${s.id}',1)">↓</button></div>`).join("")}
function moveSection(id,d){snap();let a=current().sections,i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];S.selected=id;render()}function duplicateSection(id){snap();let a=current().sections,i=a.findIndex(x=>x.id===id),n={...a[i],id:uid(),title:a[i].title+" — Copy"};a.splice(i+1,0,n);S.selected=n.id;render()}function deleteSection(id){snap();current().sections=current().sections.filter(x=>x.id!==id);S.selected=current().sections[0]?.id;render()}function selectPage(i){S.page=i;S.selected=current().sections[0]?.id;render()}function addPage(){snap();S.pages.push(makePage("New Page"));S.page=S.pages.length-1;S.selected=current().sections[0].id;render()}function duplicatePage(){snap();let n=JSON.parse(JSON.stringify(current()));n.name=n.name+" — Copy";n.sections.forEach(x=>x.id=uid());S.pages.splice(S.page+1,0,n);S.page++;S.selected=current().sections[0].id;render()}
function setDevice(d){S.device=d;dDesk.classList.toggle("active",d==="desktop");dTab.classList.toggle("active",d==="tablet");dMob.classList.toggle("active",d==="mobile");renderCanvas()}function saveProject(){try{localStorage.setItem("brandflowV8",JSON.stringify({...S,history:[]}));toast("Saved locally")}catch(e){toast("Browser storage is full — export your project")}}function loadProject(){let x=localStorage.getItem("brandflowV8");if(!x){toast("No saved project");return}S=JSON.parse(x);theme();render();toast("Loaded") }function undo(){let x=S.history.pop();if(!x){toast("Nothing to undo");return}let z=JSON.parse(x);S.pages=z.pages;S.page=z.page;S.selected=z.selected;S.headingFont=z.headingFont||S.headingFont;S.bodyFont=z.bodyFont||S.bodyFont;render();toast("Undo complete")}
function exportProject(){let out='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(S.brand)+'</title><link href="https://fonts.googleapis.com/css2?family='+encodeURIComponent(S.headingFont).replace(/%20/g,"+")+':wght@400;500;600;700&family='+encodeURIComponent(S.bodyFont).replace(/%20/g,"+")+':wght@400;500;600;700&display=swap" rel="stylesheet"><style>'+document.querySelector("style").innerHTML+'</style></head><body><div class="canvas">'+current().sections.map(sectionHTML).join("")+'</div></body></html>';let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));a.download=(S.brand||"brandflow").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".html";a.click();toast("HTML exported")}
function preview(){let w=window.open();w.document.write('<style>'+document.querySelector("style").innerHTML+'</style><div class="canvas">'+current().sections.map(sectionHTML).join("")+'</div>');w.document.close()}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function init(){S.headingFont=THEMES[S.industry].heading;S.bodyFont=THEMES[S.industry].body;S.pages=[makePage("Home")];S.selected=S.pages[0].sections[0].id;render()}init();
</script></body></html>
